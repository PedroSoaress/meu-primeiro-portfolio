<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="exp-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081b2f" />
      <stop offset="50%" stop-color="#0a3966" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="badge-exp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a66c2" />
      <stop offset="100%" stop-color="#004182" />
    </linearGradient>
    <filter id="shadow-exp" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="220" fill="url(#exp-bg)" rx="8" />
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="55" x2="400" y2="55" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="0" y1="110" x2="400" y2="110" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  
  <!-- LinkedIn / Experiences Card Mockup -->
  <g transform="translate(100, 32)" filter="url(#shadow-exp)">
    <rect width="200" height="122" rx="12" fill="url(#badge-exp)" />
    <!-- 'in' icon -->
    <rect x="22" y="24" width="28" height="28" rx="6" fill="#ffffff" />
    <text x="36" y="44" text-anchor="middle" fill="#0a66c2" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="18">in</text>
    
    <!-- Network nodes -->
    <circle cx="160" cy="30" r="4" fill="#ffffff" opacity="0.8" />
    <circle cx="178" cy="40" r="3" fill="#ffffff" opacity="0.6" />
    <circle cx="145" cy="45" r="3" fill="#ffffff" opacity="0.5" />
    <line x1="160" y1="30" x2="178" y2="40" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
    <line x1="160" y1="30" x2="145" y2="45" stroke="#ffffff" stroke-width="1.2" opacity="0.4" />
    
    <!-- Text -->
    <text x="22" y="80" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="16">Experiências</text>
    <text x="22" y="102" fill="#e0f2fe" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="11">Trajetória Profissional &amp; Projetos</text>
  </g>
  <text x="200" y="196" text-anchor="middle" fill="#bae6fd" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="13" letter-spacing="0.5">Perfil Profissional • Networking &amp; Artigos</text>
</svg>
