<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="lat-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="60%" stop-color="#112240" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow-lat" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="220" fill="url(#lat-bg)" rx="8" />
  
  <!-- Subtle Lines -->
  <line x1="0" y1="55" x2="400" y2="55" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="0" y1="110" x2="400" y2="110" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  
  <!-- Academic / Lattes Mockup -->
  <g transform="translate(100, 32)" filter="url(#shadow-lat)">
    <rect width="200" height="122" rx="12" fill="url(#badge-grad)" />
    <!-- Seal / Academic Icon -->
    <circle cx="36" cy="36" r="16" fill="#ffffff" opacity="0.95" />
    <!-- Graduation / Certificate icon in seal -->
    <path d="M26 36 L36 30 L46 36 L36 42 Z" fill="#1e3a8a" />
    <path d="M30 38.5 L30 43 Q36 46 42 43 L42 38.5" fill="none" stroke="#1e3a8a" stroke-width="1.5" />
    
    <!-- Tag CNPq -->
    <rect x="122" y="24" width="58" height="22" rx="6" fill="#0f172a" opacity="0.6" />
    <text x="151" y="39" text-anchor="middle" fill="#93c5fd" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="11">CNPq</text>
    
    <!-- Texts -->
    <text x="22" y="80" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="16">Currículo Lattes</text>
    <text x="22" y="102" fill="#dbeafe" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="11">Produção Científica &amp; Acadêmica</text>
  </g>
  <text x="200" y="196" text-anchor="middle" fill="#bfdbfe" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="13" letter-spacing="0.5">Plataforma Lattes • Ministério da Ciência</text>
</svg>
