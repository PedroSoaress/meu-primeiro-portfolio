<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cgc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091420" />
      <stop offset="50%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="cgc-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="shadow-cgc" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="400" height="220" fill="url(#cgc-bg)" rx="8" />
  
  <!-- Subtle Grid Lines -->
  <line x1="0" y1="55" x2="400" y2="55" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  <line x1="0" y1="110" x2="400" y2="110" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
  
  <!-- Showcase Mockup -->
  <g transform="translate(100, 32)" filter="url(#shadow-cgc)">
    <rect width="200" height="122" rx="12" fill="url(#cgc-card)" />
    <!-- Store / Cart Bag Icon -->
    <rect x="22" y="22" width="28" height="24" rx="4" fill="#0f172a" opacity="0.9" />
    <path d="M28 22 A 8 8 0 0 1 44 22" stroke="#0f172a" stroke-width="2.5" fill="none" opacity="0.9" />
    <!-- Shop badge -->
    <rect x="115" y="22" width="65" height="22" rx="11" fill="#ffffff" opacity="0.9" />
    <text x="147" y="37" text-anchor="middle" fill="#0369a1" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="10">LOJA &amp; LP</text>
    <!-- Brand text -->
    <text x="22" y="80" fill="#ffffff" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="17">Cartão Getcard</text>
    <text x="22" y="102" fill="#e0f2fe" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="11">Compre seu Cartão Inteligente</text>
  </g>
  <text x="200" y="196" text-anchor="middle" fill="#bae6fd" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="13" letter-spacing="0.5">Landing Page Comercial &amp; Negócios</text>
</svg>
